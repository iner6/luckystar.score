<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>興趣分配記錄表</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

    :root {
      --ink: #7653a8;
      --line: #8062b7;
      --focus: #ff77ac;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,.9), transparent 28rem),
        linear-gradient(145deg, #f0eaff, #ffeaf4 48%, #e8f7ff);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .workspace {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 18px 18px 92px;
    }

    .stage {
      position: relative;
      width: min(1353px, calc(100vw - 36px));
      aspect-ratio: 1353 / 1163;
      filter: drop-shadow(0 18px 32px rgba(94, 67, 139, .22));
    }

    .artboard {
      position: absolute;
      inset: 0 auto auto 0;
      width: 1353px;
      height: 1163px;
      overflow: hidden;
      transform: scale(var(--sheet-scale, 1));
      transform-origin: 0 0;
      isolation: isolate;
    }

    .template {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 1353px;
      height: 1163px;
      user-select: none;
      pointer-events: none;
    }

    /* Exact pixel map of the grid printed in the source artwork. */
    .score-grid {
      position: absolute;
      z-index: 1;
      left: 40px;
      top: 181px;
      width: 1272px;
      height: 860px;
      display: grid;
      grid-template-columns: 180px 75px 73px 74px 77px 79px 70px 73px 69px 74px 67px 73px 71px 70px 73px 74px;
      grid-template-rows: 61px 64px 60px 64px 61px 60px 61px 61px 60px 63px 62px 61px 59px 63px;
    }

    .cell {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      text-align: center;
      line-height: 1.15;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255,255,255,.95);
    }

    .corner-note {
      align-items: flex-end;
      padding-bottom: 13px;
      color: #a56ba8;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .category {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .18em;
    }

    .category.tags { color: #608bcc; }
    .category.ideal { color: #bd8d42; }
    .category.truth { color: #549783; }

    .slot-label {
      font-size: 15px;
      font-weight: 700;
      color: #8875b0;
      letter-spacing: .06em;
    }

    .section-label {
      font-size: 18px;
      font-weight: 900;
      color: #b75f8a;
      letter-spacing: .12em;
    }

    .target-label {
      padding-inline: 2px;
      font-size: 15px;
      font-weight: 700;
      color: #5e5995;
      background: rgba(255,255,255,.2);
    }

    .target-label.reserved { color: #a29ab5; }

    .row-label,
    .total-label {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #9d547e;
    }

    .total-label { color: #754ca0; }

    .score-input {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 8px;
      outline: 0;
      color: #694796;
      background: transparent;
      font: 900 22px/1 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      text-align: center;
      caret-color: var(--focus);
      appearance: none;
      transition: background-color .15s ease, box-shadow .15s ease;
    }

    .score-input:hover { background: rgba(255,255,255,.36); }
    .score-input:focus {
      background: rgba(255,255,255,.6);
      box-shadow: inset 0 0 0 3px rgba(255,119,172,.48);
    }
    .score-input:disabled { cursor: not-allowed; }

    .total-value {
      font-size: 21px;
      font-weight: 900;
      color: #754ca0;
    }

    .actions {
      position: fixed;
      z-index: 10;
      right: 22px;
      bottom: 22px;
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 12px 35px rgba(78, 53, 121, .2);
      backdrop-filter: blur(14px);
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 0 20px;
      cursor: pointer;
      font: 800 15px/1 "Noto Sans TC", sans-serif;
      letter-spacing: .08em;
    }

    button:focus-visible { outline: 3px solid rgba(255,119,172,.45); outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .65; }
    .secondary { color: #795896; background: #f1eafd; }
    .primary { color: #fff; background: linear-gradient(135deg, #9063c5, #e66fa4); box-shadow: 0 6px 16px rgba(172,89,158,.3); }

    .toast {
      position: fixed;
      z-index: 11;
      left: 50%;
      top: 18px;
      translate: -50% -90px;
      padding: 11px 18px;
      border-radius: 999px;
      color: #fff;
      background: #6f55a1;
      box-shadow: 0 10px 28px rgba(75,52,112,.25);
      font-weight: 700;
      transition: translate .25s ease;
    }

    .toast.show { translate: -50% 0; }

    .exporting .score-input:focus { background: transparent; box-shadow: none; }

    @media (max-width: 640px) {
      .workspace { padding: 8px 8px 78px; }
      .stage { width: calc(100vw - 16px); }
      .actions { right: 10px; bottom: 10px; }
      button { min-height: 40px; padding-inline: 15px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <div class="stage" id="stage">
      <section class="artboard" id="artboard" aria-label="興趣分配記錄表">
        <img class="template" src="record-sheet.png" alt="">
        <div class="score-grid" id="scoreGrid"></div>
      </section>
    </div>
  </main>

  <div class="actions" aria-label="表格操作">
    <button class="secondary" id="resetBtn" type="button">清除</button>
    <button class="primary" id="exportBtn" type="button">匯出圖片</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const grid = document.getElementById('scoreGrid');
    const stage = document.getElementById('stage');
    const artboard = document.getElementById('artboard');
    const exportBtn = document.getElementById('exportBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');

    const maleRows = ['江叙白', '林泽宇', '顾星辰', '秋亦帆'];
    const femaleRows = ['苏晚晴', '温以宁', '夏知柚', '许星眠'];
    const femaleTargets = ['晚晴', '以宁', '知柚', '星眠', '预留'];
    const maleTargets = ['叙白', '泽宇', '星辰', '亦帆', '预留'];
    const groups = [
      { label: '我的标签', className: 'tags' },
      { label: '我的理想型', className: 'ideal' },
      { label: '三真一假', className: 'truth' }
    ];
    const STORAGE_KEY = 'interest-score-sheet-v2';

    function addCell(text, col, row, className = '', colSpan = 1, rowSpan = 1) {
      const cell = document.createElement('div');
      cell.className = `cell ${className}`.trim();
      cell.style.gridColumn = `${col} / span ${colSpan}`;
      cell.style.gridRow = `${row} / span ${rowSpan}`;
      cell.textContent = text;
      grid.appendChild(cell);
      return cell;
    }

    function renderHeader() {
      addCell('對象與分數', 1, 1, 'corner-note', 1, 2);

      groups.forEach((group, groupIndex) => {
        addCell(group.label, 2 + groupIndex * 5, 1, `category ${group.className}`, 5);
        ['①', '②', '③', '④', '預留'].forEach((label, index) => {
          addCell(label, 2 + groupIndex * 5 + index, 2, `slot-label${index === 4 ? ' reserved' : ''}`);
        });
      });
    }

    function renderSectionHeader(section, row, targets) {
      addCell(section === 'male' ? '男生打分' : '女生打分', 1, row, 'section-label');
      groups.forEach((_, groupIndex) => {
        targets.forEach((name, targetIndex) => {
          addCell(name, 2 + groupIndex * 5 + targetIndex, row, `target-label${targetIndex === 4 ? ' reserved' : ''}`);
        });
      });
    }

    function renderScoreRows(section, names, startRow) {
      names.forEach((name, scorerIndex) => {
        const gridRow = startRow + scorerIndex;
        addCell(name, 1, gridRow, 'row-label');

        for (let scoreColumn = 0; scoreColumn < 15; scoreColumn += 1) {
          const holder = addCell('', scoreColumn + 2, gridRow, 'input-holder');
          const input = document.createElement('input');
          input.className = 'score-input';
          input.type = 'text';
          input.inputMode = 'numeric';
          input.maxLength = 2;
          input.autocomplete = 'off';
          input.setAttribute('aria-label', `${name} ${groups[Math.floor(scoreColumn / 5)].label} ${scoreColumn % 5 + 1}`);
          input.dataset.key = `${section}-${scorerIndex}-${scoreColumn}`;

          if (scoreColumn % 5 === 4) {
            input.disabled = true;
            input.setAttribute('aria-label', '預留欄位');
          }

          holder.appendChild(input);
        }
      });
    }

    function renderTotals(section, row) {
      addCell('合計得分', 1, row, 'total-label');
      for (let scoreColumn = 0; scoreColumn < 15; scoreColumn += 1) {
        const cell = addCell(scoreColumn % 5 === 4 ? '—' : '0', scoreColumn + 2, row, 'total-value');
        cell.dataset.total = `${section}-${scoreColumn}`;
      }
    }

    function buildGrid() {
      renderHeader();
      renderSectionHeader('male', 3, femaleTargets);
      renderScoreRows('male', maleRows, 4);
      renderTotals('male', 8);
      renderSectionHeader('female', 9, maleTargets);
      renderScoreRows('female', femaleRows, 10);
      renderTotals('female', 14);
    }

    function updateScale() {
      const scale = stage.clientWidth / 1353;
      artboard.style.setProperty('--sheet-scale', scale);
    }

    function sanitize(input) {
      const clean = input.value.replace(/\D/g, '').slice(0, 2);
      if (input.value !== clean) input.value = clean;
    }

    function calculateTotals() {
      ['male', 'female'].forEach(section => {
        for (let scoreColumn = 0; scoreColumn < 15; scoreColumn += 1) {
          const output = grid.querySelector(`[data-total="${section}-${scoreColumn}"]`);
          if (scoreColumn % 5 === 4) {
            output.textContent = '—';
            continue;
          }

          let total = 0;
          grid.querySelectorAll(`.score-input[data-key^="${section}-"]`).forEach(input => {
            const column = Number(input.dataset.key.split('-').at(-1));
            if (column === scoreColumn) total += Number(input.value || 0);
          });
          output.textContent = String(total);
        }
      });
    }

    function save() {
      const values = {};
      grid.querySelectorAll('.score-input:not(:disabled)').forEach(input => {
        if (input.value) values[input.dataset.key] = input.value;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
    }

    function restore() {
      try {
        const values = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        Object.entries(values).forEach(([key, value]) => {
          const input = grid.querySelector(`[data-key="${key}"]`);
          if (input) input.value = String(value).replace(/\D/g, '').slice(0, 2);
        });
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
      calculateTotals();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function exportImage() {
      if (typeof html2canvas !== 'function') {
        showToast('匯出元件尚未載入，請重新整理');
        return;
      }

      exportBtn.disabled = true;
      exportBtn.textContent = '產生中…';
      document.activeElement?.blur();
      artboard.classList.add('exporting');

      try {
        await document.fonts.ready;
        const canvas = await html2canvas(artboard, {
          width: 1353,
          height: 1163,
          scale: 2,
          backgroundColor: null,
          useCORS: true,
          logging: false,
          onclone: clonedDocument => {
            const clonedArtboard = clonedDocument.getElementById('artboard');
            clonedArtboard.style.transform = 'none';
            clonedArtboard.style.setProperty('--sheet-scale', 1);
            clonedArtboard.classList.add('exporting');
          }
        });

        const link = document.createElement('a');
        link.download = '興趣分配記錄表.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('圖片已匯出');
      } catch (error) {
        console.error(error);
        showToast('匯出失敗，請再試一次');
      } finally {
        artboard.classList.remove('exporting');
        exportBtn.disabled = false;
        exportBtn.textContent = '匯出圖片';
      }
    }

    buildGrid();
    restore();
    updateScale();
    new ResizeObserver(updateScale).observe(stage);

    grid.addEventListener('input', event => {
      if (!event.target.matches('.score-input')) return;
      sanitize(event.target);
      calculateTotals();
      save();
    });

    grid.addEventListener('keydown', event => {
      if (!event.target.matches('.score-input')) return;
      if (event.key === 'Enter') {
        event.preventDefault();
        const inputs = [...grid.querySelectorAll('.score-input:not(:disabled)')];
        const next = inputs[inputs.indexOf(event.target) + 1];
        next?.focus();
        next?.select();
      }
    });

    grid.addEventListener('focusin', event => {
      if (event.target.matches('.score-input')) event.target.select();
    });

    resetBtn.addEventListener('click', () => {
      grid.querySelectorAll('.score-input:not(:disabled)').forEach(input => { input.value = ''; });
      localStorage.removeItem(STORAGE_KEY);
      calculateTotals();
      showToast('已清除所有分數');
    });

    exportBtn.addEventListener('click', exportImage);
  </script>
</body>
</html>
